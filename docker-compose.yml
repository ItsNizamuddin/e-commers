services:
  redis:
    image: redis:7-alpine
    container_name: ecommers-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional local Redis GUI (development profile only)
  # Run with: docker compose --profile dev up -d
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ecommers-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    profiles:
      - dev
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
