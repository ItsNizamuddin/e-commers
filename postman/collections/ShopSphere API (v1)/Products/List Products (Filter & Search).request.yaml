$kind: http-request
url: "{{baseUrl}}/products?page=1&limit=20&currency=USD&minPrice=100&maxPrice=5000"
method: GET
queryParams:
  page: "1"
  limit: "20"
  currency: USD
  minPrice: "100"
  maxPrice: "5000"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns product list', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data).to.be.an('array');
      });
    language: text/javascript
order: 2000
