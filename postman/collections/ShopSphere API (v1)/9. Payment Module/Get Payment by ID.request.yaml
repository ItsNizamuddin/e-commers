$kind: http-request
description: Retrieves non-sensitive payment record details for authorized customer or matching guest session.
url: "{{baseUrl}}/payments/{{paymentId}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
