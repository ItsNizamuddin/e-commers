$kind: http-request
description: Modifies item quantity and recalculates subtotal and line totals. Setting quantity to 0 removes the item. Supports OCC expectedVersion.
url: "{{baseUrl}}/cart/items/{{variantId}}"
method: PATCH
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    disabled: true
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "quantity": 4,
      "expectedVersion": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Quantity updated in cart', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
      });
    language: text/javascript
order: 3000
