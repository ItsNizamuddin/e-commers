$kind: http-request
description: Admin endpoint to search and filter orders across all customers.
url: "{{baseUrl}}/orders/admin/orders?page=1&limit=20"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  page: "1"
  limit: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
