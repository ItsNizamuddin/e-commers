$kind: http-request
description: Cancels a confirmed order, requests payment gateway refund, and restocks inventory.
url: "{{baseUrl}}/orders/{{orderId}}/cancel"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "expectedVersion": 1,
      "reason": "Customer requested cancellation before shipment"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
