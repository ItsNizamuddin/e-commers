$kind: http-request
description: Lists paginated order history for the authenticated customer.
url: "{{baseUrl}}/orders/my-orders?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      if (json.data && json.data.length > 0) {
          pm.environment.set('orderId', json.data[0].id);
          pm.environment.set('orderNumber', json.data[0].orderNumber);
      }
    language: text/javascript
order: 1000
