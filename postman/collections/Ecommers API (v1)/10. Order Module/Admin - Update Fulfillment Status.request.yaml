$kind: http-request
description: Admin endpoint to advance fulfillment status with OCC guard and audit trail.
url: "{{baseUrl}}/orders/admin/{{orderId}}/fulfillment"
method: PATCH
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "fulfillmentStatus": "SHIPPED",
      "expectedVersion": 1,
      "carrier": "FedEx",
      "trackingNumber": "FDX987654321"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
