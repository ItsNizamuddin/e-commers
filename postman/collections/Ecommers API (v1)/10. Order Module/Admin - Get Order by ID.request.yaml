$kind: http-request
description: Admin endpoint to inspect complete order details.
url: "{{baseUrl}}/orders/admin/{{orderId}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
