$kind: http-request
description: Empties all items from the active cart.
url: "{{baseUrl}}/cart"
method: DELETE
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Cart is now empty', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.items).to.have.lengthOf(0);
          pm.expect(json.data.summary.itemCount).to.eql(0);
      });
    language: text/javascript
order: 5000
