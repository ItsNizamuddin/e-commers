$kind: http-request
description: Pulls the variant item completely from the active cart and re-sums totals.
url: "{{baseUrl}}/cart/items/{{variantId}}"
method: DELETE
headers:
  - key: Authorization
    value: Bearer {{accessToken}}
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
