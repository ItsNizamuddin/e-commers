$kind: http-request
description: Enterprise payment webhook endpoint with raw body HMAC verification and 4-state event deduplication.
url: "{{baseUrl}}/payments/webhook"
method: POST
headers:
  Content-Type: application/json
  x-payment-signature: "{{paymentSignature}}"
body:
  type: text
  content: |-
    {
      "id": "evt_mock_001",
      "type": "payment.succeeded",
      "paymentIntentId": "{{paymentIntentId}}",
      "checkoutId": "{{checkoutId}}",
      "amountMinor": 5000,
      "currency": "USD"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
