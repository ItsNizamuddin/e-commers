$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: DELETE
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
