$kind: http-request
url: "{{baseUrl}}/categories/slug/fresh-organic-produce"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns food category by slug', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.eql(true);
          pm.expect(jsonData.data.slug).to.eql('fresh-organic-produce');
      });
    language: text/javascript
order: 5000
