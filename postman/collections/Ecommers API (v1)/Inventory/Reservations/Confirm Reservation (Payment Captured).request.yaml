$kind: http-request
description: Permanently commits stock onHand and reserved counts upon successful order payment.
url: "{{baseUrl}}/reservations/{{reservationId}}/confirm"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Reservation status is CONFIRMED', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.status).to.eql('CONFIRMED');
      });
    language: text/javascript
order: 4000
