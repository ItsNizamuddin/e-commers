$kind: http-request
description: Public endpoint masking raw counts for competitive privacy. Returns UX-friendly availability badges (isInStock, isLowStock, allowBackorder).
url: "{{baseUrl}}/products/{{productId}}/variants/{{variantId}}/availability"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns availability flags', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property('isInStock');
          pm.expect(json.data).to.have.property('allowBackorder');
      });
    language: text/javascript
order: 1000
