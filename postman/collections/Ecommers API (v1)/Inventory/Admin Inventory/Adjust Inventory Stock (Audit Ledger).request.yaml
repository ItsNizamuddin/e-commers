$kind: http-request
description: Atomically mutates inventory physical onHand count and logs an immutable entry in the Stock Movement audit ledger within a MongoDB transaction.
url: "{{baseUrl}}/admin/inventory/adjust"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "variantId": "{{variantId}}",
      "warehouseId": "{{warehouseId}}",
      "deltaOnHand": 15,
      "reason": "Inbound shipment replenishment batch #9921",
      "expectedVersion": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Stock adjusted successfully', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.inventory).to.be.an('object');
          pm.expect(json.data.movement).to.be.an('object');
          pm.environment.set('movementId', json.data.movement.id);
          pm.collectionVariables.set('movementId', json.data.movement.id);
      });
    language: text/javascript
order: 3000
