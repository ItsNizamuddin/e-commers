$kind: http-request
description: Fetches individual stock movement record by ID with actor, timestamp, quantity, and delta details.
url: "{{baseUrl}}/admin/inventory/movements/{{movementId}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Movement detail matches ID', function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.id).to.eql(pm.environment.get('movementId'));
      });
    language: text/javascript
order: 6000
